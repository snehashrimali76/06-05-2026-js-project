<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saral Sahara - Sign In</title>
    <link rel="stylesheet" href="style2.css">
    <script src="login.js"></script>
</head>
<body class="login-body">

    <header class="navbar">
        <div class="logo"><a href="saral sahara.html">SARAL SAHARA</a></div>
        <nav class="nav-links">
            <a href="services.html">Services</a>
            <a href="vaccination.html">Vaccination Log</a>
            <a href="contact us.html">Contact</a>
        </nav>
        </header>

---

    <main class="login-container">
        <div class="login-card">
            <h2>Sign In to Your Account</h2>
            <p class="login-description">Access your medicine reminders and child's health records.</p>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">Phone Number or Email</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="cta-button full-width">Sign In</button>
            </form>
        </div>
    </main>
    
---

    </footer>

</body>
</html>
